name: Fetch Full Financial Statements

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Mã chứng khoán, cách nhau bởi dấu phẩy (vd HPG,TCB,FPT)"
        required: false
        default: "HPG,TCB,FPT,PNJ,MWG,FRT,MBB,TCX"
  schedule:
    # Báo cáo tài chính năm không đổi thường xuyên, chạy hàng tuần là đủ
    - cron: "0 19 * * 0" # 19:00 UTC Chủ nhật = 02:00 thứ Hai giờ VN

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        run: python fetch_full_financials.py "${{ github.event.inputs.symbols || 'HPG,TCB,FPT,PNJ,MWG,FRT,MBB,TCX' }}"

      - name: Upload CSVs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-financial-statements
          path: "financials/**/*.csv"

      - name: Commit and push CSVs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "financials/"
          if git diff --cached --quiet; then
            echo "Không có thay đổi dữ liệu, bỏ qua commit."
          else
            git commit -m "chore: cập nhật BCTC đầy đủ $(date -u +'%Y-%m-%d')"
            git push
          fi
