name: Fetch Full Financial Statements

on:
  # Chỉ chạy thủ công qua tab Actions - không có lịch tự động.
  workflow_dispatch:
    inputs:
      symbols:
        description: "Mã chứng khoán, cách nhau bởi dấu phẩy (vd HPG,TCB,FPT)"
        required: false
        default: "HPG,TCB,FPT,PNJ,MWG,FRT,MBB,TCX"
      fetch_quarter:
        description: "Có lấy thêm dữ liệu theo QUÝ không (tạo/cập nhật <MÃ>_Q.xlsx)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  # API key được lưu trong GitHub Settings > Secrets and variables > Actions.
  # Không ghi key trực tiếp vào workflow.
  VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
  # Dùng cho gdrive_download.py / gdrive_upload.py (đồng bộ Google Drive).
  GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
  GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # `vnstock` và `vnai` đang bị PyPI "quarantined" -> cài workaround (giống repo P).
      - name: Install vnai stub (PyPI quarantine workaround)
        run: pip install ./vendor/vnai_stub

      - name: Install vnstock from GitHub (PyPI quarantine workaround)
        run: pip install --no-deps git+https://github.com/thinh-vu/vnstock.git@v4.0.4

      - name: Tải file Excel "chuẩn" (năm + quý, đã có sheet chỉ số tự tạo) từ Google Drive về
        run: python gdrive_download.py

      - name: Run fetch script (theo NĂM)
        run: python fetch_full_financials.py "${{ github.event.inputs.symbols || 'HPG,TCB,FPT,PNJ,MWG,FRT,MBB,TCX' }}" year

      # Mỗi bước merge ghi `changed=<các file .xlsx có dữ liệu mới>` vào
      # $GITHUB_OUTPUT và cảnh báo khoản mục không khớp tên vào tab Summary.
      - name: Merge CSV -> Excel theo NĂM (3 sheet/mã, giữ lại lịch sử nhiều năm)
        id: merge_year
        run: python merge_financials.py "${{ github.event.inputs.symbols || 'HPG,TCB,FPT,PNJ,MWG,FRT,MBB,TCX' }}" year

      - name: Run fetch script (theo QUÝ)
        if: ${{ github.event.inputs.fetch_quarter != 'false' }}
        run: python fetch_full_financials.py "${{ github.event.inputs.symbols || 'HPG,TCB,FPT,PNJ,MWG,FRT,MBB,TCX' }}" quarter

      - name: Merge CSV -> Excel theo QUÝ (ra <MÃ>_Q.xlsx riêng, giữ lại lịch sử nhiều quý)
        id: merge_quarter
        if: ${{ github.event.inputs.fetch_quarter != 'false' }}
        run: python merge_financials.py "${{ github.event.inputs.symbols || 'HPG,TCB,FPT,PNJ,MWG,FRT,MBB,TCX' }}" quarter

      - name: Xoá CSV tạm (chỉ giữ lại file Excel)
        run: find financials -name "*.csv" -delete

      - name: Đẩy các file Excel có thay đổi (năm + quý) lên lại Google Drive
        if: steps.merge_year.outputs.changed != '' || steps.merge_quarter.outputs.changed != ''
        run: python gdrive_upload.py "${{ steps.merge_year.outputs.changed }},${{ steps.merge_quarter.outputs.changed }}"

      - name: Thông báo - không có nội dung cập nhật
        if: steps.merge_year.outputs.changed == '' && steps.merge_quarter.outputs.changed == ''
        run: echo "::notice::Không có nội dung cập nhật ở mã nào (năm + quý) -> bỏ qua upload Google Drive."

      - name: Upload Excel as artifact
        if: steps.merge_year.outputs.changed != '' || steps.merge_quarter.outputs.changed != ''
        uses: actions/upload-artifact@v4
        with:
          name: full-financial-statements
          path: "financials/**/*.xlsx"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "financials/"
          if git diff --cached --quiet; then
            echo "Không có thay đổi dữ liệu, bỏ qua commit."
          else
            git commit -m "chore: cập nhật BCTC đầy đủ $(date -u +'%Y-%m-%d')"
            git push
          fi
