name: Fetch HPG Financial Ratios

on:
  # Cho phép bấm chạy thủ công từ tab Actions trên GitHub
  workflow_dispatch:
    inputs:
      symbol:
        description: "Mã chứng khoán"
        required: false
        default: "HPG"
  # Tự động chạy định kỳ: 02:00 sáng (giờ VN, UTC+7) mỗi thứ Hai
  # Báo cáo tài chính theo năm không đổi thường xuyên nên chạy hàng tuần là đủ
  schedule:
    - cron: "0 19 * * 0" # 19:00 UTC Chủ nhật = 02:00 thứ Hai giờ VN

permissions:
  contents: write # cần quyền ghi để commit CSV lại repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        run: python fetch_hpg_financials.py "${{ github.event.inputs.symbol || 'HPG' }}"

      - name: Upload CSV as artifact
        uses: actions/upload-artifact@v4
        with:
          name: financial-ratios-csv
          path: "*_financial_ratios.csv"

      - name: Commit and push CSV if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*_financial_ratios.csv"
          if git diff --cached --quiet; then
            echo "Không có thay đổi dữ liệu, bỏ qua commit."
          else
            git commit -m "chore: cập nhật dữ liệu tài chính $(date -u +'%Y-%m-%d')"
            git push
          fi
